# CI (plan.md M6): build the firmware variants + run the M1–M4 DoD boot
# suite (scripts/test.sh) on a GitHub-hosted runner — build+boot tests, no
# root, plain TCG QEMU (the same thing the local rig does).
#
# Variants:
#   rk3506qemu    — QEMU test rig; built image is BOOT-TESTED (test job).
#   virgilio_rpi2b — hardware receiver (sink); the flashable sdcard.img
#                    (boot.vfat + squashfs root + data ext4) is uploaded as
#                    an artifact. No QEMU boot test: the raspi2b machine is
#                    not this project's rig — receiver validation happens on
#                    the physical bridge rig (docs/bridge-rig-hw-sink.md).
#   (virgilio_srcqemu / virgilio_rpi02w stay local: rig source role and the
#    already-shipped Zero 2 W variant.)
#
# The other M6 items (PREEMPT_RT/cyclictest, NEON benchmarks, zram) are
# SUSPENDED by decision: TCG emulation dominates latency measurements, so
# they must wait for real hardware (D14/D15 already showed the emulation
# ceiling). Read-only rootfs shipped via the squashfs+overlay prod layout.
#
# Build job notes:
# - submodules: only `buildroot` (the build system) and `deps/oui` (vendored
#   by scripts/webui/build-frontend.sh) are needed — the app packages pin
#   and fetch their own sources.
# - BR2_DL_DIR + the output dir live on the big /mnt disk (Buildroot needs
#   ~15 GB per variant; the root disk is tighter). The download caches
#   (~2.4 GB each, content-addressed per package) are persisted across runs
#   via actions/cache, keyed per variant.
# - Full build ≈ 1.5–3 h per variant on a 4-vCPU runner (Rust cross-builds
#   dominate); the matrix runs the variants in parallel.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        variant: [rk3506qemu, virgilio_rpi2b]
    env:
      BR2_DL_DIR: /mnt/virgilio/dl
      DEFCONFIG: ${{ matrix.variant }}_defconfig
    steps:
      - uses: actions/checkout@v4

      - name: Submodules (buildroot + vendored oui only)
        run: |
          git submodule update --init --depth 1 buildroot deps/oui

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev git wget cpio unzip rsync bc \
            bison flex libssl-dev file python3

      - name: Move output to the big disk
        run: |
          # /mnt is root-owned on GitHub runners; claim it for the build user
          sudo mkdir -p /mnt/virgilio
          sudo chown -R "$(id -u):$(id -g)" /mnt/virgilio
          mkdir -p /mnt/virgilio/dl /mnt/virgilio/output
          ln -s /mnt/virgilio/output output
          : > /mnt/virgilio/build.log
          df -h / /mnt

      - name: Buildroot download cache
        uses: actions/cache@v4
        with:
          path: /mnt/virgilio/dl
          key: br-dl-v1-${{ matrix.variant }}-${{ hashFiles(format('br-external/configs/{0}_defconfig', matrix.variant)) }}
          restore-keys: |
            br-dl-v1-${{ matrix.variant }}-
            br-dl-v1-

      - name: Build firmware (${{ matrix.variant }})
        run: |
          ./scripts/build.sh 2>&1 | tee /mnt/virgilio/build.log
          IMG=output/${{ matrix.variant }}/images
          test -s "$IMG/zImage"
          if [ "${{ matrix.variant }}" = virgilio_rpi2b ]; then
            test -s "$IMG/sdcard.img"
          else
            test -s "$IMG/rootfs.ext2"
          fi

      - name: Pack images
        run: |
          IMG=/mnt/virgilio/output/${{ matrix.variant }}/images
          if [ "${{ matrix.variant }}" = virgilio_rpi2b ]; then
            tar -C "$IMG" -czf /mnt/virgilio/images.tgz \
              sdcard.img zImage bcm2709-rpi-2-b.dtb bcm2710-rpi-2-b.dtb
          else
            tar -C "$IMG" -czf /mnt/virgilio/images.tgz -h zImage rootfs.ext2 rootfs.ext4
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-images-${{ matrix.variant }}
          path: /mnt/virgilio/images.tgz
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.variant }}
          path: /mnt/virgilio/build.log
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          # ipxe-qemu: virtio-net-pci option ROMs (qemu-system-arm does not
          # pull them in; without efi-virtio.rom the rig fails at startup)
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm ipxe-qemu
          qemu-system-arm --version | head -1

      - name: Fetch images
        uses: actions/download-artifact@v4
        with:
          name: firmware-images-rk3506qemu

      - name: Run M1–M4 DoD suite (scripts/test.sh)
        run: |
          mkdir -p images && tar -C images -xzf images.tgz
          ls -la images
          VIRGILIO_IMAGES="$PWD/images" ./scripts/test.sh
