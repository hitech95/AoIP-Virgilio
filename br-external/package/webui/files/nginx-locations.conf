# shared webui locations (included by every server block)

root /usr/share/webui/ui;

# cache policy: the shell entry + skin must always be revalidated (a stale
# index.html pins dead hashed assets); assets/views are content-hashed
# (plus the ?_t= cache buster on views) -> immutable.
location = /index.html {
	add_header Cache-Control "no-cache";
}
location = /skin.css {
	add_header Cache-Control "no-cache";
}
location /assets/ {
	add_header Cache-Control "public, max-age=31536000, immutable";
}
location /views/ {
	gzip_static on;
	gzip_types application/javascript;
	add_header Cache-Control "public, max-age=31536000, immutable";
}

location /oui- {
	scgi_pass unix:/run/webui.sock;
	include scgi_params;
}

# auth_request target: webuid validates the webui_sid cookie
location = /_auth {
	internal;
	scgi_pass unix:/run/webui.sock;
	include scgi_params;
	scgi_param HTTP_COOKIE $http_cookie if_not_empty;
}

# camilladsp websocket — only path in, gated on the session
location /ws {
	auth_request /_auth;
	proxy_pass http://127.0.0.1:5000;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	proxy_read_timeout 3600s;
}
