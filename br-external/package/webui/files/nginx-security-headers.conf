# webui security headers (shared snippet).
#
# nginx add_header inheritance: a level that declares ANY add_header
# loses everything inherited -- so every location that sets its own
# Cache-Control must also include this file, or CSP/nosniff/referrer
# silently vanish (http-level defaults only cover locations without
# add_header of their own, e.g. /oui-* and /ws).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'" always;
