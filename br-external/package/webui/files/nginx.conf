# webui nginx front (plan/webui.md §6) — the ONLY exposed process.
# Static base: server blocks live in /etc/nginx/conf.d/ (assembled by
# /etc/init.d/webui from the uci webui.tls section); location blocks are
# shared via webui-locations.conf.
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr notice;

events {
	worker_connections 64;
}

http {
	include mime.types;
	default_type application/octet-stream;
	access_log off;
	sendfile on;
	client_max_body_size 16m;

	# gzip_static serves the pre-built .gz dists (vite-plugin-compression,
	# deleteOriginFile). It only kicks in for types listed in gzip_types:
	# cover every asset flavor the SPA ships.
	gzip_static on;
	gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

	# hardening headers (M5)
	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy no-referrer always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:" always;

	# temp paths on tmpfs, FLAT: nginx mkdirs only the final component
	client_body_temp_path /tmp/nginx_client;
	proxy_temp_path /tmp/nginx_proxy;
	fastcgi_temp_path /tmp/nginx_fastcgi;
	uwsgi_temp_path /tmp/nginx_uwsgi;
	scgi_temp_path /tmp/nginx_scgi;

	include /etc/nginx/conf.d/*.conf;
}
