# virgilio rpi2b sdcard: FAT boot | squashfs root (ro) | ext4 data (rw)
# The data partition holds the overlay (root_data/{upper,work}) and
# user_data — see /etc/preinit and plan/squashfs-overlay-userdata.md.
image boot.vfat {
	vfat {
		files = {
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/config.txt",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/fixup.dat",
			"rpi-firmware/start.elf",
			"zImage",
			"bcm2709-rpi-2-b.dtb",
			"bcm2710-rpi-2-b.dtb"
		}
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "virgilio-data"
	}
	size = 128M
	empty = true
}

image sdcard.img {
	hdimage {}

	partition boot {
		partition-type = 0xC
		bootable = true
		image = "boot.vfat"
	}
	partition rootfs {
		partition-type = 0x83
		image = "rootfs.squashfs"
	}
	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
