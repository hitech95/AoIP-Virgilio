# ALSA loopback pair (snd-aloop): what is played to "loopplay" can be
# captured from "loopcap" — used to bridge players (e.g. MPD web radio)
# into camilladsp capture (Alsa:loopcap) for Dante TX. The inferno
# pcms ship in /etc/alsa/conf.d/60-inferno.conf (inferno package).

pcm.loopplay {
	type plug
	slave.pcm "hw:Loopback,0,0"
}
pcm.loopcap {
	type plug
	slave.pcm "hw:Loopback,1,0"
}
