# ALSA config for the inferno virtual capture device.
# Settings (NAME, BIND_IP, RX_CHANNELS, CLOCK_PATH, ...) come from the
# INFERNO_-prefixed environment variables or plugin defaults — see the
# inferno README. A parameterless PCM definition is used so that
# `arecord -L` lists it (PCMs with @args are not listed).

pcm.inferno {
	type inferno
	# period-level polling (see 0001-capture-poll-period-level.patch):
	# explicit for documentation; on by default (PERIOD_POLL=0 disables)
	PERIOD_POLL 1
	# usrvclock socket exported by statime (see /etc/init.d/statime);
	# without a clock the plugin delivers no audio
	CLOCK_PATH "/tmp/ptp-usrvclock"

	hint {
		show on
		description "Inferno Dante (AoIP) virtual capture device"
	}
}

# Legacy polling behavior for A/B comparison (0001-capture-poll-period-level
# patch): POLLIN reported on every received packet instead of per ALSA
# period — makes readi-based consumers spin (~1 pegged core in camilladsp).
# Default (pcm.inferno, PERIOD_POLL unset) = period-level polling.
pcm.inferno_legacy {
	type inferno
	CLOCK_PATH "/tmp/ptp-usrvclock"
	PERIOD_POLL 0
	hint {
		show on
		description "Inferno Dante capture, legacy per-packet polling"
	}
}

# Parameterized variant for explicit device strings (not listed by -L):
#   arecord -D 'inferno2:RX_CHANNELS=8:CLOCK_PATH=/tmp/ptp-usrvclock'
pcm.inferno2 {
	type inferno
	@args.NAME { type string }
	@args.DEVICE_ID { type string }
	@args.BIND_IP { type string }
	@args.SAMPLE_RATE { type string }
	@args.PROCESS_ID { type string }
	@args.ALT_PORT { type string }
	@args.RX_CHANNELS { type string }
	@args.TX_CHANNELS { type string }
	@args.CLOCK_PATH { type string }
	@args.RX_LATENCY_NS { type string }
	@args.TX_LATENCY_NS { type string }
	@args.PERIOD_POLL { type string }

	NAME $NAME
	DEVICE_ID $DEVICE_ID
	BIND_IP $BIND_IP
	SAMPLE_RATE $SAMPLE_RATE
	PROCESS_ID $PROCESS_ID
	ALT_PORT $ALT_PORT
	RX_CHANNELS $RX_CHANNELS
	TX_CHANNELS $TX_CHANNELS
	CLOCK_PATH $CLOCK_PATH
	RX_LATENCY_NS $RX_LATENCY_NS
	TX_LATENCY_NS $TX_LATENCY_NS
	PERIOD_POLL $PERIOD_POLL
}

# ALSA loopback pair (snd-aloop): what is played to "loopplay" can be
# captured from "loopcap" — used to bridge players (e.g. MPD web radio)
# into camilladsp capture (Alsa:loopcap) for Dante TX.
pcm.loopplay {
	type plug
	slave.pcm "hw:Loopback,0,0"
}
pcm.loopcap {
	type plug
	slave.pcm "hw:Loopback,1,0"
}
