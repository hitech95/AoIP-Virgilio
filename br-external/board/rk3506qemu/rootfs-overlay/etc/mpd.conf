# MPD — web-radio / media source for the Dante transmitter.
# Audio goes: MPD -> ALSA "loopplay" (snd-aloop) -> camilladsp
# capture 'Alsa:loopcap' -> Inferno TX. Stations are user data:
# `mpd-ctl play <url>` or a playlist in /var/lib/mpd/playlist
# (`mpc load <name> && mpc play`).

music_directory "/var/lib/mpd/music"
playlist_directory "/var/lib/mpd/playlist"
db_file "/var/lib/mpd/database"
log_file "syslog"
pid_file "/run/mpd.pid"
state_file "/var/lib/mpd/state"
sticker_file "/var/lib/mpd/sticker.sql"
bind_to_address "127.0.0.1"
# fixed format for the camilladsp capture side of the loopback: MPD
# resamples ANY source (22.05k/44.1k radio stations, files) to 48000:16:2
# before writing loopplay, so the whole chain (aloop, camilladsp, Dante) is
# rate-locked at 48k and sources can be switched freely. Native-48k sources
# pass through with no conversion cost. NB: do NOT set auto_resample "no"
# here — it bypasses this format lock and forwards the source rate raw
# (pitch-shifted audio on rate mismatch; that was a real bug once).
audio_output {
	type "alsa"
	name "loopback to camilladsp"
	device "loopplay"
	mixer_type "none"
	format "48000:16:2"
}
filesystem_charset "UTF-8"
