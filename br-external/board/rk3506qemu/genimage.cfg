# Mode B disk image (see plan/plan.md, 6.6): GPT layout mirroring Rockchip eMMC.
# Built by post-image.sh with host-genimage; requires BR2_PACKAGE_HOST_GENIMAGE=y.
# NOTE: idbloader/uboot are placeholders on QEMU (Boot ROM path not emulated).

image boot.ext4 {
	ext4 {
		label = "boot"
	}
	size = 64M
	mountpoint = "/boot"
	# TODO (Mode B): copy zImage + dtb + extlinux.conf here (post-build or files = [...])
}

image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition idbloader {
		in-partition-table = false
		image = "idbloader.bin"
		offset = 32K
	}

	partition uboot {
		in-partition-table = false
		image = "u-boot.itb"
		offset = 8M
	}

	partition boot {
		partition-type-uuid = U
		bootable = true
		image = "boot.ext4"
		offset = 16M
	}

	partition rootfs {
		partition-type-uuid = L
		image = "rootfs.ext4"
	}
}
